name: Main CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore LaundryApp.sln

      - name: Build
        run: dotnet build LaundryApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LaundryApp.sln --configuration Release --no-build

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json

      - name: Install dependencies
        working-directory: ClientApp
        run: npm ci

      - name: Build frontend
        working-directory: ClientApp
        run: npm run build
